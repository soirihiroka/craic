[package]
name = "craic-render-skia"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
craic-file-support.workspace = true
craic-language.workspace = true
craic-platform.workspace = true
craic-text-layout.workspace = true
libc.workspace = true
log.workspace = true
polling.workspace = true
regex.workspace = true
rustix-openpty = "0.2"
tokio.workspace = true
url = "2"

[build-dependencies]
bindgen = "0.72"

[target.'cfg(target_os = "linux")'.dependencies]
skia-safe.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "0.99", default-features = false, features = ["binary-cache", "embed-icudtl", "metal", "svg", "textlayout"] }
